services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vantara
      POSTGRES_USER: vantara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vantara_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantara -d vantara"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://vantara:${POSTGRES_PASSWORD:-vantara_local_only}@db:5432/vantara
      CHURN_MODEL_PATH: ${CHURN_MODEL_PATH:-/app/data/processed/model_data/random_forest.pkl}
      CLV_MODEL_PATH: ${CLV_MODEL_PATH:-/app/models_artifacts/clv_random_forest.pkl}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard:
    build: .
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
