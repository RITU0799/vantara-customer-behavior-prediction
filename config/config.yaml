project:
  name: vantara-customer-intelligence
  random_seed: 42
data:
  source: data/raw/online_retail_II.xlsx
  sheets:
    - Year 2009-2010
    - Year 2010-2011
  churn_horizon_days: 90
  clv_horizon_days: 90
  missing_customer_id_policy: exclude_from_customer_models
  invalid_price_policy: remove_nonpositive
models:
  churn_model: data/processed/model_data/random_forest.pkl
  clv_model: models_artifacts/clv_random_forest.pkl
  churn_threshold: 0.5
segmentation:
  kmeans_min_clusters: 2
  kmeans_max_clusters: 10
  gmm_min_components: 2
  gmm_max_components: 6
service:
  batch_csv_max_rows: 10000
  api_port: 8000
  dashboard_port: 8501
evaluation_targets:
  churn_roc_auc: 0.80
  churn_recall: 0.70
  clv_r2: 0.60
  api_p95_ms: 400
  dashboard_load_seconds: 3
